
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

def githubRepoUrl = 'https://github.com/ppissias/JPlateSolve'
def githubRepoScmUrl = 'https://github.com/ppissias/JPlateSolve.git'
def centralArtifactId = 'jplatesolve'
def centralStagingRepository = layout.buildDirectory.dir('repos/central-staging')

def inMemorySigningKey = providers.gradleProperty('signingKey')
        .map { it.replace("\\n", "\n") }
        .orNull
def inMemorySigningPassword = providers.gradleProperty('signingPassword').orNull
def hasInMemorySigning = inMemorySigningKey != null && inMemorySigningPassword != null
def hasLegacySigning = findProperty('signing.keyId') != null &&
        findProperty('signing.password') != null &&
        findProperty('signing.secretKeyRingFile') != null
def signingConfigured = hasInMemorySigning || hasLegacySigning

group = 'io.github.ppissias.jplatesolve'
version = '1.0.1'
description = 'Pure Java library for automated astrometric plate solving via ASTAP and Astrometry.net.'

base {
    archivesName = centralArtifactId
}

java {
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    if (options instanceof org.gradle.external.javadoc.StandardJavadocDocletOptions) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

test {
    useJUnit()
}

tasks.register('integrationTest', Test) {
    description = 'Runs live Astrometry.net integration tests.'
    group = 'verification'
    useJUnit()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

